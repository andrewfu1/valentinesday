<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 A Question for Elena 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fff5f5 0%, #ffd1dc 100%);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(214, 51, 132, 0.2);
        }

        .question {
            font-size: 1.8rem;
            color: #e91e8c;
            margin-bottom: 2rem;
        }

        .buttons {
            display: flex;
            gap: 2rem;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        button {
            font-family: 'Georgia', serif;
            font-size: 1.2rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .yes-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4081 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }

        .yes-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.6);
        }

        .no-btn {
            background: #ffb6c1;
            color: #d63384;
            position: relative;
        }

        /* Celebration screen */
        .celebration {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .celebration h1 {
            font-size: 3rem;
            animation: pulse 0.5s ease infinite alternate;
        }

        .celebration .hearts {
            font-size: 4rem;
            margin: 1rem;
        }

        .celebration .message {
            font-size: 1.5rem;
            color: #e91e8c;
            margin-top: 1rem;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        /* Floating hearts background */
        .heart {
            position: fixed;
            font-size: 1.5rem;
            animation: float 4s ease-in infinite;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="questionScreen">
        <h1>Hey Elena! 💕</h1>
        <p class="question">Will you be my Valentine?</p>
        <div class="buttons">
            <button class="yes-btn" id="yesBtn">Yes! 💖</button>
            <button class="no-btn" id="noBtn">No</button>
        </div>
    </div>

    <div class="celebration" id="celebrationScreen">
        <h1>Yay!! 🎉</h1>
        <div class="hearts">💕💖💕</div>
        <p class="message">I knew you'd say yes!</p>
        <p class="message">I love you, Elena! ❤️</p>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionScreen = document.getElementById('questionScreen');
        const celebrationScreen = document.getElementById('celebrationScreen');

        let yesScale = 1;
        let noScale = 1;

        const noTexts = ['No', 'Are you sure?', 'Really?', 'Think again!', 'Pretty please?', '😢', 'Last chance...'];
        let noTextIndex = 0;

        // Make Yes button bigger and No button smaller on hover
        noBtn.addEventListener('mouseenter', () => {
            // Move the No button to a random position
            const maxX = window.innerWidth - noBtn.offsetWidth - 50;
            const maxY = window.innerHeight - noBtn.offsetHeight - 50;
            const randomX = Math.max(50, Math.random() * maxX);
            const randomY = Math.max(50, Math.random() * maxY);

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // Change the No button text
            noTextIndex = (noTextIndex + 1) % noTexts.length;
            noBtn.textContent = noTexts[noTextIndex];

            // Make Yes button bigger
            yesScale += 0.15;
            yesBtn.style.transform = `scale(${yesScale})`;

            // Make No button smaller
            noScale = Math.max(0.5, noScale - 0.05);
            noBtn.style.transform = `scale(${noScale})`;
        });

        // Celebration when Yes is clicked
        yesBtn.addEventListener('click', () => {
            questionScreen.style.display = 'none';
            celebrationScreen.style.display = 'flex';

            // Create lots of floating hearts
            for (let i = 0; i < 50; i++) {
                setTimeout(() => createHeart(), i * 100);
            }
        });

        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.textContent = ['💕', '💖', '❤️', '💗', '💓'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (3 + Math.random() * 3) + 's';
            document.body.appendChild(heart);

            // Remove heart after animation
            setTimeout(() => heart.remove(), 6000);
        }

        // Create some initial floating hearts
        setInterval(() => {
            if (celebrationScreen.style.display === 'flex') {
                createHeart();
            }
        }, 500);
    </script>
</body>
</html>
